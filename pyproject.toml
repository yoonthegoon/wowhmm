[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wowhmm"
version = "0.1.5"
description = "Who owes whom how much money"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "yoonthegoon", email = "yoonthegoon@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]
dependencies = [
    "pandas==2.2.2",
]

[project.urls]
Homepage = "https://github.com/yoonthegoon/wowhmm"
Repository = "https://github.com/yoonthegoon/wowhmm"
Issues = "https://github.com/yoonthegoon/wowhmm/issues"

[tool.uv]
dev-dependencies = [
    "build",
    "twine",
]

[tool.hatch.build.targets.wheel]
packages = ["wowhmm"]